<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tsGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <!-- Steel I-beam icon -->
  <g transform="translate(20, 12)">
    <rect x="2" y="0" width="20" height="4" rx="1" fill="url(#steelBeam)"/>
    <rect x="10" y="4" width="4" height="14" fill="url(#steelBeam)"/>
    <rect x="2" y="18" width="20" height="4" rx="1" fill="url(#steelBeam)"/>
  </g>
  <!-- Text Label -->
  <text x="32" y="43" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">TATA</text>
  <text x="32" y="52" font-family="'Inter', sans-serif" font-weight="700" font-size="6.5" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">STEEL</text>
</svg>
