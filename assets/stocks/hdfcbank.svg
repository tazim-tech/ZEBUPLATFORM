<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="hdfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004C8F"/>
      <stop offset="100%" stop-color="#002D57"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#hdfcGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2B6CB0" stroke-width="1.5" opacity="0.6"/>
  <!-- HDFC Red/Blue geometric symbol -->
  <g transform="translate(18, 12)">
    <!-- Red outer brackets -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#ED232A"/>
    <rect x="4" y="4" width="20" height="20" fill="#004C8F"/>
    <!-- Intersecting white crossbars -->
    <rect x="11" y="0" width="6" height="28" fill="#FFFFFF"/>
    <rect x="0" y="11" width="28" height="6" fill="#FFFFFF"/>
    <rect x="11" y="11" width="6" height="6" fill="#ED232A"/>
  </g>
  <!-- Text Label -->
  <text x="32" y="52" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HDFC BANK</text>
</svg>
