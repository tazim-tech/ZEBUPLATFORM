<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#goldGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#CA8A04" stroke-width="1.5" opacity="0.6"/>
  <!-- Gold Coin Emblem -->
  <circle cx="32" cy="22" r="12" fill="url(#goldCoin)"/>
  <circle cx="32" cy="22" r="9.5" fill="none" stroke="#78350F" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="32" y="26" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#78350F" text-anchor="middle">Au</text>
  <!-- Text Label -->
  <text x="32" y="44" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="9" fill="#FDE047" text-anchor="middle" letter-spacing="0.5">GOLD</text>
  <text x="32" y="52" font-family="'Inter', sans-serif" font-weight="800" font-size="6" fill="#CA8A04" text-anchor="middle" letter-spacing="1">BEES ETF</text>
</svg>
