  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tcsGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2A437C" stroke-width="1.5" opacity="0.6"/>
