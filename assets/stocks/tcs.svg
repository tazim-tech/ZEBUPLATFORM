      <stop offset="0%" stop-color="#0F2454"/>
      <stop offset="100%" stop-color="#001233"/>
    </linearGradient>
    <linearGradient id="tcsCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
